<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ecomm · Workflows</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/CORTEX-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/CORTEX-180.png" />
    <meta name="theme-color" content="#0D0B16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CORTEX" />
  </head>
  <body class="cortex workspace bg-slate-50 text-slate-900">
    <div class="cortex-layout">
      <aside class="cortex-sidebar" data-sidebar></aside>
      <main class="p-5 md:p-10 min-w-0">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-7">
          <div>
            <a id="back" href="/workflows" hidden class="text-sm text-teal-700"
              >← Todos os workflows</a
            >
            <p
              class="text-xs text-teal-700 font-semibold uppercase tracking-widest mt-2"
            >
              Operations monitor
            </p>
            <h1 id="heading" class="text-3xl font-semibold mt-2">Workflows</h1>
            <p id="subtitle" class="text-slate-500 mt-2">
              Acompanha as execuções e as validações que precisam de ti.
            </p>
          </div>
          <div class="flex gap-3">
            <button id="refresh" class="secondary">Atualizar</button
            ><a href="/" class="primary text-sm">Novo teste</a>
          </div>
        </div>
        <p
          id="notice"
          role="status"
          aria-live="polite"
          class="text-sm text-rose-700 mb-4"
        ></p>
        <div id="list-tools">
          <div
            id="metrics"
            class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"
          ></div>
          <div class="flex flex-wrap gap-3 mb-5">
            <input
              id="search"
              type="search"
              placeholder="Pesquisar workflow…"
              aria-label="Pesquisar workflow"
              class="field"
            /><select id="filter" aria-label="Filtrar workflows" class="field">
              <option value="all">Todos os estados</option>
              <option value="running">Em execução</option>
              <option value="pending_validation">Aguarda validação</option>
              <option value="needs_attention">Precisa de atenção</option>
              <option value="ready">Pronto para iniciar</option>
              <option value="awaiting_implementation">Etapas futuras</option>
            </select>
          </div>
        </div>
        <div id="content" aria-live="polite"></div>
        <nav
          id="pagination"
          aria-label="Paginação de workflows"
          class="flex flex-wrap items-center justify-between gap-3 mt-5 text-xs text-slate-500"
        >
          <span id="range"></span>
          <div class="flex gap-3">
            <button id="previous" class="secondary">Anterior</button
            ><button id="next" class="secondary">Seguinte</button>
          </div>
        </nav>
      </main>
    </div>
    <script type="module" src="/js/workflows.js"></script>
  <script type="module" src="/js/cortex-shell.js"></script></body>
</html>
