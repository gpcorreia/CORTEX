<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cortex VPL Server — The Brain</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/CORTEX-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/CORTEX-180.png" />
    <meta name="theme-color" content="#0D0B16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CORTEX" />
  </head>
  <body class="cortex">
    <div class="cortex-layout">
      <aside class="cortex-sidebar" data-sidebar></aside>
      <main class="cortex-main" id="cortex-app">
        <p role="status" class="empty-state">A carregar o teu workspace…</p>
      </main>
    </div>
    <dialog id="cortex-dialog" aria-labelledby="dialog-title"></dialog>
    <div id="cortex-toast" role="status" aria-live="polite"></div>
    <script type="module" src="/js/cortex-shell.js"></script>
    <script type="module" src="/js/cortex.js"></script>
  </body>
</html>
